version: '3'

services:
  mysql:
    image: mysql:8.0.40 # 使用的镜像
    container_name: mysql # 启动的实例名称
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      MYSQL_ROOT_PASSWORD: youyu1233 # root 用户密码，启动后记得修改密码
      TZ: Asia/Shanghai # 设置时区
    ports:
      - "3306:3306" # 端口映射
    volumes:
      - /data/volumes/mysql/log:/var/log/mysql
      - /data/volumes/mysql/data:/var/lib/mysql # 将数据目录挂载到本地目录以进行持久化
      - /data/volumes/mysql/conf:/etc/mysql/conf.d
    #      - ./mysql-init:/docker-entrypoint-initdb.d # 启动脚本
    restart: always # 崩溃后自动重启
    networks:
      - mynetwork # 指定网络

  redis:
    image: redis:7
    container_name: redis
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      TZ: Asia/Shanghai # 设置时区
    ports:
      - "6379:6379"
    networks:
      - mynetwork
    volumes:
      - /data/volumes/redis/data:/data # 持久化
      - /data/volumes/redis/conf/redis.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]

  rabbitmq:
    image: rabbitmq:3.12.6-management # 支持管理面板的消息队列
    container_name: rabbitmq
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      RABBITMQ_DEFAULT_USER: root
      RABBITMQ_DEFAULT_PASS: youyu1233 # root 用户密码，启动后记得修改密码
      TZ: Asia/Shanghai # 设置时区
    ports:
      - "5672:5672"
      - "15672:15672" # RabbitMQ Dashboard 端口
    volumes:
      - /data/volumes/rabbitmq:/var/lib/rabbitmq # 持久化
    networks:
      - mynetwork

  nacos:
    image: nacos/nacos-server:v2.2.3
    container_name: nacos
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 384m
      JVM_XMN: 128m
      JVM_MS: 32m
      JVM_MMS: 128m
      NACOS_AUTH_ENABLE: true
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - /data/volumes/nacos/data:/home/nacos/data
      - /data/volumes/nacos/conf:/home/nacos/conf
    networks:
      - mynetwork

  nginx:
    image: nginx:latest
    container_name: nginx
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    environment:
      TZ: Asia/Shanghai # 设置时区
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./assets/nginx/nginx.conf:/etc/nginx/nginx.conf:ro # 主配置文件（只读）
      - /data/volumes/nginx/logs:/var/log/nginx # 日志目录
      - /data/volumes/nginx/html:/usr/share/nginx/html # 静态文件目录
      - /data/volumes/nginx/ssl:/etc/nginx/ssl:ro # SSL 证书目录（只读）
      - /data/volumes/nginx/conf.d:/etc/nginx/conf.d # 额外配置目录
    networks:
      - mynetwork
    depends_on:
      - nacos
    restart: always

networks:
  mynetwork:
    external: true