user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    #tcp_nopush on;

    keepalive_timeout 65;

    #gzip on;

    # HTTP 自动跳转 HTTPS - v2.youyul.com
    server {
        listen 80;
        server_name v2.youyul.com;
        rewrite ^(.*) https://$server_name$1 permanent;
    }

    # HTTPS 主站 - v2.youyul.com
    server {
        listen 443 ssl;
        server_name v2.youyul.com;

        ssl_certificate /etc/nginx/ssl/v2.youyul.com.pem;
        ssl_certificate_key /etc/nginx/ssl/v2.youyul.com.key;

        # 前端页面
        location / {
            root /usr/share/nginx/html/web;
            try_files $uri $uri/ /index.html;
            index index.html index.htm;
        }

        # 后端接口代理
        location /plat {
            rewrite ^/plat/(.*)$ /$1 break;
            add_header Cache-Control "no-store";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_pass http://gateway-service:8080/;
        }
    }

    # 管理后台 - admin.youyul.com
    server {
        listen 80;
        server_name admin.youyul.com;

        # 前端页面
        location / {
            root /usr/share/nginx/html/manage;
            try_files $uri $uri/ /index.html;
            index index.html index.htm;
        }

        # 后端接口代理
        location /plat {
            rewrite ^/plat/(.*)$ /$1 break;
            add_header Cache-Control "no-store";
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Host $http_host;
            proxy_pass http://gateway-service:8080/;
        }
    }

    # Nacos 控制台代理 - v3.youyul.com
    server {
        listen 80;
        server_name v3.youyul.com;

        location / {
            proxy_pass http://nacos:8848;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    include /etc/nginx/conf.d/*.conf;
}
